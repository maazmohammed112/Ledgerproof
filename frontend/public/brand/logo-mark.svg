  <rect width="48" height="48" rx="10" fill="#0F172A" />
  <!-- Upper Ledger Line / Evidence Rule -->
  <path d="M12 14H30C32.2 14 34 15.8 34 18V18" stroke="#4F46E5" stroke-width="3" stroke-linecap="round"/>
  <!-- Primary Ledger Column L-Stem -->
  <path d="M14 14V34C14 35.1 14.9 36 16 36H36" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Second Parallel Subledger Rule -->
